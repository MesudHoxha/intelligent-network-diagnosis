  <title id="title">Masked-evidence method behavior</title>
  <desc id="desc">Accepted masked-evidence metrics for Rule-based, Machine Learning, and Hybrid methods. The strict Rule-based method reports insufficient evidence, while Machine Learning and Hybrid retain coverage and have identical aggregate results.</desc>
