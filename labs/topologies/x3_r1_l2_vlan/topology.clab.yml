name: x3r1

topology:
  defaults:
    kind: linux
    image: ind-linux:0.1
    image-pull-policy: Never

  nodes:
    hosta:
      exec:
        - ip addr flush dev eth1
        - ip addr add 10.30.10.10/24 dev eth1
        - ip link set eth1 up

    hostb:
      exec:
        - ip addr flush dev eth1
        - ip addr add 10.30.10.20/24 dev eth1
        - ip link set eth1 up

    hostc:
      exec:
        - ip addr flush dev eth1
        - ip addr add 10.30.99.10/24 dev eth1
        - ip link set eth1 up

    hostd:
      exec:
        - ip addr flush dev eth1
        - ip addr add 10.30.99.20/24 dev eth1
        - ip link set eth1 up

    sw1:
      exec:
        - ip link add br0 type bridge vlan_filtering 1 vlan_default_pvid 0
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - bridge vlan add dev eth1 vid 10 pvid untagged
        - bridge vlan add dev eth2 vid 99 pvid untagged
        - bridge vlan add dev eth3 vid 10
        - bridge vlan add dev eth3 vid 99 pvid untagged

    sw2:
      exec:
        - ip link add br0 type bridge vlan_filtering 1 vlan_default_pvid 0
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - bridge vlan add dev eth1 vid 10 pvid untagged
        - bridge vlan add dev eth2 vid 99 pvid untagged
        - bridge vlan add dev eth3 vid 10
        - bridge vlan add dev eth3 vid 99 pvid untagged

  links:
    - endpoints: ["hosta:eth1", "sw1:eth1"]
    - endpoints: ["hostc:eth1", "sw1:eth2"]
    - endpoints: ["sw1:eth3", "sw2:eth3"]
    - endpoints: ["sw2:eth1", "hostb:eth1"]
    - endpoints: ["sw2:eth2", "hostd:eth1"]
