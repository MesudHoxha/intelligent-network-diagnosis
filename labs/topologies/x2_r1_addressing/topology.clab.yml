name: x2r1

topology:
  defaults:
    kind: linux
    image: ind-linux:0.1
    image-pull-policy: Never

  nodes:
    hosta:
      exec:
        - ip addr flush dev eth1
        - ip addr add 10.20.1.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.20.1.1 dev eth1

    r1:
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip addr flush dev eth1
        - ip addr add 10.20.1.1/24 dev eth1
        - ip link set eth1 up
        - ip addr flush dev eth2
        - ip addr add 10.20.2.1/24 dev eth2
        - ip link set eth2 up

    hostb:
      exec:
        - ip addr flush dev eth1
        - ip addr add 10.20.2.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 10.20.2.1 dev eth1

  links:
    - endpoints: ["hosta:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "hostb:eth1"]

