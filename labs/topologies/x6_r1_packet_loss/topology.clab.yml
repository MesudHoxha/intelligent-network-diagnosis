name: x6r1
topology:
  nodes:
    hosta:
      kind: linux
      image: ind-linux:0.1
      exec:
        - ip address add 10.61.1.2/30 dev eth1
        - ip route add default via 10.61.1.1
    r1:
      kind: linux
      image: ind-linux:0.1
      exec:
        - ip address add 10.61.1.1/30 dev eth1
        - ip address add 10.61.12.1/30 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
        - ip route add 10.61.23.0/30 via 10.61.12.2
        - ip route add 10.61.3.0/30 via 10.61.12.2
    r2:
      kind: linux
      image: ind-linux:0.1
      exec:
        - ip address add 10.61.12.2/30 dev eth1
        - ip address add 10.61.23.1/30 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
        - ip route add 10.61.1.0/30 via 10.61.12.1
        - ip route add 10.61.3.0/30 via 10.61.23.2
    r3:
      kind: linux
      image: ind-linux:0.1
      exec:
        - ip address add 10.61.23.2/30 dev eth1
        - ip address add 10.61.3.1/30 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
        - ip route add 10.61.12.0/30 via 10.61.23.1
        - ip route add 10.61.1.0/30 via 10.61.23.1
    hostb:
      kind: linux
      image: ind-linux:0.1
      exec:
        - ip address add 10.61.3.2/30 dev eth1
        - ip route add default via 10.61.3.1
  links:
    - endpoints: ["hosta:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "hostb:eth1"]
