[project]
name = "intelligent-network-diagnosis"
version = "0.1.0"
description = "Hybrid intelligent system for diagnosing computer network problems"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pyyaml",
    "rich",
    "jsonschema>=4.18,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
