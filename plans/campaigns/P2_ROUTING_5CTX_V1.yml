schema_version: 1

campaign:
  id: P2_ROUTING_5CTX_V1
  description: >-
    Define the first complete five-context routing dataset campaign
    with the approved N0, C1, and C2 classes and two repetitions per
    class and context.

  execution:
    order: listed
    failure_policy: stop

  dataset:
    row_schema_version: 2
    expected_fault_types:
      - no_fault
      - missing_static_route
      - wrong_next_hop
    repetitions_per_class_context: 2
    expected_row_count: 30

  split:
    algorithm: complete_context_group_hash_v2
    seed: 20260730
    ratios:
      train: 0.6
      validation: 0.2
      test: 0.2
    expected_group_allocation:
      train:
        - CTX_G03_TOP02_BRANCH_MID
        - CTX_G04_TOP02_DUAL_TRANSIT
        - CTX_G05_TOP03_ASYMMETRIC_RETURN
      validation:
        - CTX_G01_TOP01_LINEAR_2R
      test:
        - CTX_G02_TOP02_CHAIN_3R

  contexts:
    - group_slot: G01
      topology_id: TOP_01
      split_group_id: CTX_G01_TOP01_LINEAR_2R
      topology_file: labs/topologies/top01_routed/topology.clab.yml
      baseline_validator: >-
        labs/topologies/top01_routed/scripts/validate_baseline.sh
      batch_plan: plans/batches/P2_G01_CAMPAIGN.yml
      observation:
        direction: hosta_to_hostb
        route_observer_node: r1
        transit_node: r2

    - group_slot: G02
      topology_id: TOP_02_CHAIN
      split_group_id: CTX_G02_TOP02_CHAIN_3R
      topology_file: labs/topologies/top02_chain/topology.clab.yml
      baseline_validator: >-
        labs/topologies/top02_chain/scripts/validate_baseline.sh
      batch_plan: plans/batches/P2_G02_CAMPAIGN.yml
      observation:
        direction: hosta_to_hostb
        route_observer_node: r1
        transit_node: r2

    - group_slot: G03
      topology_id: TOP_02_BRANCH
      split_group_id: CTX_G03_TOP02_BRANCH_MID
      topology_file: labs/topologies/top02_branch/topology.clab.yml
      baseline_validator: >-
        labs/topologies/top02_branch/scripts/validate_baseline.sh
      batch_plan: plans/batches/P2_G03_CAMPAIGN.yml
      observation:
        direction: hosta_to_hostc
        route_observer_node: r2
        transit_node: r4

    - group_slot: G04
      topology_id: TOP_02_DUAL_TRANSIT
      split_group_id: CTX_G04_TOP02_DUAL_TRANSIT
      topology_file: >-
        labs/topologies/top02_dual_transit/topology.clab.yml
      baseline_validator: >-
        labs/topologies/top02_dual_transit/scripts/validate_baseline.sh
      batch_plan: plans/batches/P2_G04_CAMPAIGN.yml
      observation:
        direction: hosta_to_hostc
        route_observer_node: r1
        transit_node: r3

    - group_slot: G05
      topology_id: TOP_03_ASYMMETRIC_RETURN
      split_group_id: CTX_G05_TOP03_ASYMMETRIC_RETURN
      topology_file: >-
        labs/topologies/top03_asymmetric_return/topology.clab.yml
      baseline_validator: >-
        labs/topologies/top03_asymmetric_return/scripts/validate_baseline.sh
      batch_plan: plans/batches/P2_G05_CAMPAIGN.yml
      observation:
        direction: hosta_to_hostb
        route_observer_node: r2
        transit_node: r3
