schema_version: 1
batch:
  id: P6_E02_CLEAN_CAMPAIGN
  description: Frozen two-repetition six-class E02 clean bundle.
  execution: {order: listed, failure_policy: stop}
  entries:
    - {entry_id: e02_no_fault, scenario_path: scenarios/phase6/E02_N0_NO_FAULT.yml, repetitions: 2}
    - {entry_id: e02_missing_static_route, scenario_path: scenarios/phase6/E02_C1_MISSING_STATIC_ROUTE.yml, repetitions: 2}
    - {entry_id: e02_wrong_next_hop, scenario_path: scenarios/phase6/E02_C2_WRONG_NEXT_HOP.yml, repetitions: 2}
    - {entry_id: e02_wrong_default_gateway, scenario_path: scenarios/phase6/E02_C3_WRONG_DEFAULT_GATEWAY.yml, repetitions: 2}
    - {entry_id: e02_interface_down, scenario_path: scenarios/phase6/E02_C4_INTERFACE_DOWN.yml, repetitions: 2}
    - {entry_id: e02_acl_block, scenario_path: scenarios/phase6/E02_C5_ACL_BLOCK.yml, repetitions: 2}
