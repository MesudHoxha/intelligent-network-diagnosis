schema_version: 1
batch:
  id: P6_E04_CLEAN_CAMPAIGN
  description: Frozen two-repetition six-class E04 clean bundle.
  execution: {order: listed, failure_policy: stop}
  entries:
    - {entry_id: e04_no_fault, scenario_path: scenarios/phase6/E04_N0_NO_FAULT.yml, repetitions: 2}
    - {entry_id: e04_missing_static_route, scenario_path: scenarios/phase6/E04_C1_MISSING_STATIC_ROUTE.yml, repetitions: 2}
    - {entry_id: e04_wrong_next_hop, scenario_path: scenarios/phase6/E04_C2_WRONG_NEXT_HOP.yml, repetitions: 2}
    - {entry_id: e04_wrong_default_gateway, scenario_path: scenarios/phase6/E04_C3_WRONG_DEFAULT_GATEWAY.yml, repetitions: 2}
    - {entry_id: e04_interface_down, scenario_path: scenarios/phase6/E04_C4_INTERFACE_DOWN.yml, repetitions: 2}
    - {entry_id: e04_acl_block, scenario_path: scenarios/phase6/E04_C5_ACL_BLOCK.yml, repetitions: 2}
