openapi: 3.1.0
info:
  title: Intelligent Network Diagnosis Read-Only API
  version: 1.0.0
  description: >-
    Local read-only projection of accepted P6-R6 evidence, predictions,
    descriptive comparison, provenance, and limitations. This API does not
    execute diagnosis, fit a model, mutate a network, or create new metrics.
servers:
  - url: http://127.0.0.1:8000
security: []
x-p7-contract-id: p7_readonly_dashboard_api_v1
x-p7-read-only: true
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Report service readiness after artifact verification
      responses:
        "200":
          description: All accepted artifact bindings are verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ArtifactUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/overview:
    get:
      operationId: getOverview
      summary: Return the accepted experiment and interface overview
      responses:
        "200":
          description: Accepted overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "503":
          $ref: "#/components/responses/ArtifactUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/comparison:
    get:
      operationId: getComparison
      summary: Return accepted descriptive metrics for one frozen scope
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Scope"
          description: Defaults to overall
      responses:
        "200":
          description: Accepted three-method descriptive comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonResponse"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/ArtifactUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cases:
    get:
      operationId: listCases
      summary: List deterministic projections of the 120 report-only inputs
      parameters:
        - name: context_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: fault_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FaultType"
        - name: mask_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MaskId"
        - name: method_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MethodId"
        - name: prediction_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PredictionStatus"
          description: Requires method_id
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated cases sorted by input_id ascending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListResponse"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "503":
          $ref: "#/components/responses/ArtifactUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cases/{input_id}:
    get:
      operationId: getCase
      summary: Return evidence, target, and all accepted predictions for a case
      parameters:
        - name: input_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Resolved only against the verified in-memory case index
      responses:
        "200":
          description: Accepted case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetailResponse"
        "404":
          $ref: "#/components/responses/CaseNotFound"
        "503":
          $ref: "#/components/responses/ArtifactUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/provenance:
    get:
      operationId: getProvenance
      summary: Return verified roots, artifact references, and claim limits
      responses:
        "200":
          description: Accepted provenance projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvenanceResponse"
        "503":
          $ref: "#/components/responses/ArtifactUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  responses:
    InvalidQuery:
      description: Query parameters violate the frozen contract
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CaseNotFound:
      description: input_id does not exist in the verified report-only set
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ArtifactUnavailable:
      description: Accepted artifacts are missing or fail integrity verification
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected failure without local paths or traceback disclosure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    MethodId:
      type: string
      enum:
        - rule_based_p6_v1
        - machine_learning_p6_v1
        - hybrid_p6_v1
    Scope:
      type: string
      enum: [clean, masked_overall, overall]
      default: overall
    FaultType:
      type: string
      enum:
        - no_fault
        - missing_static_route
        - wrong_next_hop
        - wrong_default_gateway
        - interface_down
        - acl_block
    MaskId:
      type: string
      enum:
        - clean
        - mask_source_gateway_family
        - mask_route_family
        - mask_interface_state
        - mask_policy_state
    PredictionStatus:
      type: string
      enum: [RESOLVED, INSUFFICIENT_EVIDENCE, ABSTAINED, NO_RULE_MATCH]
    ArtifactReference:
      type: object
      additionalProperties: false
      required: [artifact_id, path, sha256, verified]
      properties:
        artifact_id:
          type: string
        path:
          type: string
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        verified:
          type: boolean
          const: true
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [contract_id, read_only, source_role]
      properties:
        contract_id:
          type: string
          const: p7_readonly_dashboard_api_v1
        read_only:
          type: boolean
          const: true
        source_role:
          type: string
          const: ACCEPTED_P6_R6_REPORT_ONLY_ARTIFACTS
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_QUERY
            - CASE_NOT_FOUND
            - METHOD_NOT_ALLOWED
            - ARTIFACT_SET_UNAVAILABLE
            - ARTIFACT_INTEGRITY_FAILED
            - INTERNAL_ERROR
        message:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [schema_version, error]
      properties:
        schema_version:
          type: integer
          const: 1
        error:
          $ref: "#/components/schemas/ErrorBody"
    HealthData:
      type: object
      additionalProperties: false
      required: [status, verified_root_count, projection_source_count]
      properties:
        status:
          type: string
          const: READY
        verified_root_count:
          type: integer
          const: 4
        projection_source_count:
          type: integer
          const: 15
    HealthResponse:
      type: object
      additionalProperties: false
      required: [schema_version, data, meta]
      properties:
        schema_version:
          type: integer
          const: 1
        data:
          $ref: "#/components/schemas/HealthData"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    OverviewData:
      type: object
      additionalProperties: false
      required:
        - title
        - method_order
        - class_order
        - clean_input_count
        - masked_input_count
        - total_input_count
        - selected_ml_candidate
        - selected_hybrid_policy
        - comparison_type
        - limitations
      properties:
        title:
          type: string
        method_order:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/MethodId"
        class_order:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/FaultType"
        clean_input_count:
          type: integer
          const: 24
        masked_input_count:
          type: integer
          const: 96
        total_input_count:
          type: integer
          const: 120
        selected_ml_candidate:
          type: string
          const: logreg_l2_c1
        selected_hybrid_policy:
          type: string
          const: rule_then_ml_fallback_v1
        comparison_type:
          type: string
          const: DESCRIPTIVE_ONLY
        limitations:
          type: array
          minItems: 1
          items:
            type: string
    OverviewResponse:
      type: object
      additionalProperties: false
      required: [schema_version, data, meta]
      properties:
        schema_version:
          type: integer
          const: 1
        data:
          $ref: "#/components/schemas/OverviewData"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Metrics:
      type: object
      additionalProperties: false
      required:
        - sample_count
        - accuracy
        - macro_f1
        - exact_diagnosis_rate
        - affected_prefix_rate
        - coverage
        - abstention_rate
        - insufficient_evidence_rate
      properties:
        sample_count:
          type: integer
        accuracy:
          type: number
          minimum: 0
          maximum: 1
        macro_f1:
          type: number
          minimum: 0
          maximum: 1
        exact_diagnosis_rate:
          type: number
          minimum: 0
          maximum: 1
        affected_prefix_rate:
          type: number
          minimum: 0
          maximum: 1
        coverage:
          type: number
          minimum: 0
          maximum: 1
        abstention_rate:
          type: number
          minimum: 0
          maximum: 1
        insufficient_evidence_rate:
          type: number
          minimum: 0
          maximum: 1
    MethodMetrics:
      type: object
      additionalProperties: false
      required: [method_id, metrics]
      properties:
        method_id:
          $ref: "#/components/schemas/MethodId"
        metrics:
          $ref: "#/components/schemas/Metrics"
    ComparisonData:
      type: object
      additionalProperties: false
      required:
        - comparison_id
        - comparison_type
        - scope
        - methods
        - statistical_superiority_test
      properties:
        comparison_id:
          type: string
          const: p6_r6_rules_ml_hybrid_report_only_comparison_v1
        comparison_type:
          type: string
          const: DESCRIPTIVE_ONLY
        scope:
          $ref: "#/components/schemas/Scope"
        methods:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/MethodMetrics"
        statistical_superiority_test:
          type: string
          const: NOT_PERFORMED
    ComparisonResponse:
      type: object
      additionalProperties: false
      required: [schema_version, data, meta]
      properties:
        schema_version:
          type: integer
          const: 1
        data:
          $ref: "#/components/schemas/ComparisonData"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Prediction:
      type: object
      additionalProperties: false
      required:
        - method_id
        - status
        - predicted_fault_type
        - confidence
        - diagnosis
        - reason
      properties:
        method_id:
          $ref: "#/components/schemas/MethodId"
        status:
          $ref: "#/components/schemas/PredictionStatus"
        predicted_fault_type:
          oneOf:
            - $ref: "#/components/schemas/FaultType"
            - type: "null"
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        diagnosis:
          type: [object, "null"]
        reason:
          type: string
    CaseSummary:
      type: object
      additionalProperties: false
      required:
        - input_id
        - sample_id
        - context_id
        - topology_id
        - mask_id
        - expected_fault_type
        - predictions
      properties:
        input_id:
          type: string
        sample_id:
          type: string
        context_id:
          type: string
        topology_id:
          type: string
        mask_id:
          $ref: "#/components/schemas/MaskId"
        expected_fault_type:
          $ref: "#/components/schemas/FaultType"
        predictions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/Prediction"
    Pagination:
      type: object
      additionalProperties: false
      required: [page, page_size, total_items, total_pages, sort]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        sort:
          type: string
          const: input_id:asc
    CaseListData:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaseSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"
    CaseListResponse:
      type: object
      additionalProperties: false
      required: [schema_version, data, meta]
      properties:
        schema_version:
          type: integer
          const: 1
        data:
          $ref: "#/components/schemas/CaseListData"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    EvidenceProjection:
      type: object
      additionalProperties: false
      required: [features, availability, provenance]
      properties:
        features:
          type: object
          minProperties: 10
          maxProperties: 10
          additionalProperties:
            type: string
            enum: ["true", "false", unavailable]
        availability:
          type: object
          minProperties: 10
          maxProperties: 10
          additionalProperties:
            type: string
            enum:
              - observed
              - structurally_unavailable
              - collection_unavailable
              - masked_missing
        provenance:
          type: object
          additionalProperties: false
          required: [dataset_row_sha256, evidence_path, evidence_sha256]
          properties:
            dataset_row_sha256:
              type: string
              pattern: "^[0-9a-f]{64}$"
            evidence_path:
              type: string
            evidence_sha256:
              type: string
              pattern: "^[0-9a-f]{64}$"
    CaseDetailData:
      type: object
      additionalProperties: false
      required:
        - input_id
        - sample_id
        - context_id
        - topology_id
        - mask_id
        - expected_fault_type
        - predictions
        - direction
        - source_node
        - route_observer_node
        - transit_node
        - destination_prefix
        - expected_diagnosis
        - evidence
      properties:
        input_id:
          type: string
        sample_id:
          type: string
        context_id:
          type: string
        topology_id:
          type: string
        mask_id:
          $ref: "#/components/schemas/MaskId"
        expected_fault_type:
          $ref: "#/components/schemas/FaultType"
        predictions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/Prediction"
        direction:
          type: string
        source_node:
          type: string
        route_observer_node:
          type: string
        transit_node:
          type: string
        destination_prefix:
          type: string
        expected_diagnosis:
          type: object
        evidence:
          $ref: "#/components/schemas/EvidenceProjection"
    CaseDetailResponse:
      type: object
      additionalProperties: false
      required: [schema_version, data, meta]
      properties:
        schema_version:
          type: integer
          const: 1
        data:
          $ref: "#/components/schemas/CaseDetailData"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ProvenanceData:
      type: object
      additionalProperties: false
      required:
        - roots
        - projection_source_count
        - selected_ml_candidate
        - selected_hybrid_policy
        - limitations
      properties:
        roots:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/ArtifactReference"
        projection_source_count:
          type: integer
          const: 15
        selected_ml_candidate:
          type: string
          const: logreg_l2_c1
        selected_hybrid_policy:
          type: string
          const: rule_then_ml_fallback_v1
        limitations:
          type: array
          minItems: 1
          items:
            type: string
    ProvenanceResponse:
      type: object
      additionalProperties: false
      required: [schema_version, data, meta]
      properties:
        schema_version:
          type: integer
          const: 1
        data:
          $ref: "#/components/schemas/ProvenanceData"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
