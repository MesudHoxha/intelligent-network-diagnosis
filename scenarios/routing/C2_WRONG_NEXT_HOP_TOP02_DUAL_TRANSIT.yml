schema_version: 1

scenario:
  id: C2_WRONG_NEXT_HOP_TOP02_DUAL_TRANSIT
  name: Cross-segment wrong next-hop on TOP-02 dual-transit R1
  kind: fault
  variant_id: canonical
  split_group_id: CTX_G04_TOP02_DUAL_TRANSIT
  category: routing
  description: >
    Move the R1 HostC route from the valid R3 segment to an
    unreachable address on the separate live R2 transit segment.

  topology:
    id: TOP_02_DUAL_TRANSIT
    file: labs/topologies/top02_dual_transit/topology.clab.yml

  observation:
    schema_version: 1
    direction: hosta_to_hostc
    source_container: clab-top02dual-hosta
    source_gateway_address: 10.40.1.1
    destination_address: 10.40.3.10
    destination_prefix: 10.40.3.0/24
    route_observer_node: r1
    route_observer_container: clab-top02dual-r1
    expected_next_hop: 10.40.13.2
    transit_node: r3
    transit_container: clab-top02dual-r3

  fault:
    type: wrong_next_hop
    injector: replace_route_next_hop
    target_node: r1
    target_container: clab-top02dual-r1
    parameters:
      destination_prefix: 10.40.3.0/24
      correct_next_hop: 10.40.13.2
      wrong_next_hop: 10.40.12.6
      egress_interface: eth2

  preconditions:
    - id: route_exists_before_injection
      description: R1 contains the HostC route
    - id: correct_next_hop_present_before_injection
      description: The route uses the valid R3 next-hop
    - id: baseline_observed_arm_connectivity
      description: HostA reaches HostC before injection
    - id: baseline_alternate_arm_connectivity
      description: HostA reaches HostB before injection
    - id: correct_next_hop_reachable
      description: R1 reaches R3 before injection
    - id: alternate_transit_reachable
      description: R1 reaches the real R2 neighbor
    - id: wrong_next_hop_unreachable
      description: The unassigned 10.40.12.6 address is unreachable
    - id: transit_reaches_destination
      description: R3 reaches HostC before injection

  expected_effects:
    - id: route_present_after_injection
      description: The HostC route remains installed on R1
    - id: wrong_next_hop_present_after_injection
      description: The route points to unreachable 10.40.12.6
    - id: correct_next_hop_absent_after_injection
      description: The route no longer points to R3
    - id: cross_segment_egress_used
      description: The faulty route uses eth2 toward the R2 segment
    - id: observed_arm_connectivity_fails
      description: HostA can no longer reach HostC
    - id: local_gateway_remains_reachable
      description: HostA can still reach R1
    - id: selected_transit_neighbor_remains_reachable
      description: R1 can still reach the correct R3 next-hop
    - id: selected_transit_path_remains_reachable
      description: R3 can still reach HostC
    - id: alternate_transit_neighbor_remains_reachable
      description: R1 can still reach the real R2 neighbor
    - id: alternate_arm_remains_available
      description: The R2-HostB arm remains healthy

  ground_truth:
    fault_category: routing
    fault_type: wrong_next_hop
    fault_location: r1
    affected_prefix: 10.40.3.0/24
    correct_next_hop: 10.40.13.2
    wrong_next_hop: 10.40.12.6
    root_cause: >
      Dual-transit observer R1 retains the HostC route, but points it
      through eth2 to an unassigned address on the separate R2 segment

  restoration:
    method: replace_route
    command:
      - ip
      - route
      - replace
      - 10.40.3.0/24
      - via
      - 10.40.13.2
      - dev
      - eth3
