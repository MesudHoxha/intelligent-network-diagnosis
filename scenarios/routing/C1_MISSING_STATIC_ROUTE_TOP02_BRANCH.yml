schema_version: 1

scenario:
  id: C1_MISSING_STATIC_ROUTE_TOP02_BRANCH
  name: Missing static route on TOP-02 branch R2
  kind: fault
  variant_id: canonical
  split_group_id: CTX_G03_TOP02_BRANCH_MID
  category: routing
  description: >
    Remove the static route from interior branch router R2 toward
    HostC while preserving the upstream path and the R3-HostB arm.

  topology:
    id: TOP_02_BRANCH
    file: labs/topologies/top02_branch/topology.clab.yml

  observation:
    schema_version: 1
    direction: hosta_to_hostc
    source_container: clab-top02branch-hosta
    source_gateway_address: 10.30.1.1
    destination_address: 10.30.4.10
    destination_prefix: 10.30.4.0/24
    route_observer_node: r2
    route_observer_container: clab-top02branch-r2
    expected_next_hop: 10.30.24.2
    transit_node: r4
    transit_container: clab-top02branch-r4

  fault:
    type: missing_static_route
    injector: remove_route
    target_node: r2
    target_container: clab-top02branch-r2
    parameters:
      destination_prefix: 10.30.4.0/24
      next_hop: 10.30.24.2

  preconditions:
    - id: route_exists_before_injection
      description: R2 contains the expected HostC route
    - id: baseline_observed_arm_connectivity
      description: HostA reaches HostC before injection
    - id: baseline_independent_arm_connectivity
      description: HostA reaches HostB before injection
    - id: next_hop_reachable
      description: R2 reaches R4 before injection
    - id: transit_reaches_destination
      description: R4 reaches HostC before injection

  expected_effects:
    - id: route_absent_after_injection
      description: R2 no longer contains the HostC route
    - id: observed_arm_connectivity_fails
      description: HostA can no longer reach HostC
    - id: local_gateway_remains_reachable
      description: HostA can still reach R1
    - id: transit_next_hop_remains_reachable
      description: R2 can still reach R4
    - id: selected_transit_path_remains_reachable
      description: R4 can still reach HostC
    - id: independent_arm_remains_available
      description: The R3-HostB branch remains healthy

  ground_truth:
    fault_category: routing
    fault_type: missing_static_route
    fault_location: r2
    affected_prefix: 10.30.4.0/24
    root_cause: >
      Interior branch router R2 does not contain a route toward the
      HostC network while its separate HostB branch remains valid

  restoration:
    method: add_route
    command:
      - ip
      - route
      - replace
      - 10.30.4.0/24
      - via
      - 10.30.24.2
      - dev
      - eth3
