schema_version: 1

scenario:
  id: C2_WRONG_NEXT_HOP_TOP02_CHAIN
  name: Wrong next-hop on TOP-02 chain R1
  kind: fault
  variant_id: canonical
  split_group_id: CTX_G02_TOP02_CHAIN_3R
  category: routing
  description: >
    Replace the valid R1 destination route with an unreachable
    same-segment next-hop while R2, R3, and the downstream path
    remain healthy.

  topology:
    id: TOP_02_CHAIN
    file: labs/topologies/top02_chain/topology.clab.yml

  observation:
    schema_version: 1
    direction: hosta_to_hostb
    source_container: clab-top02chain-hosta
    source_gateway_address: 10.20.1.1
    destination_address: 10.20.3.10
    destination_prefix: 10.20.3.0/24
    route_observer_node: r1
    route_observer_container: clab-top02chain-r1
    expected_next_hop: 10.20.12.2
    transit_node: r2
    transit_container: clab-top02chain-r2

  fault:
    type: wrong_next_hop
    injector: replace_route_next_hop
    target_node: r1
    target_container: clab-top02chain-r1
    parameters:
      destination_prefix: 10.20.3.0/24
      correct_next_hop: 10.20.12.2
      wrong_next_hop: 10.20.12.6
      egress_interface: eth2

  preconditions:
    - id: route_exists_before_injection
      description: R1 contains the target route
    - id: correct_next_hop_present_before_injection
      description: The route uses the valid R2 next-hop
    - id: baseline_end_to_end_connectivity
      description: HostA reaches HostB before injection
    - id: correct_next_hop_reachable
      description: R1 reaches R2 before injection
    - id: wrong_next_hop_unreachable
      description: The unassigned 10.20.12.6 address is unreachable
    - id: transit_reaches_destination
      description: R2 reaches HostB through R3 before injection

  expected_effects:
    - id: route_present_after_injection
      description: The destination route remains installed on R1
    - id: wrong_next_hop_present_after_injection
      description: The route points to the unreachable 10.20.12.6
    - id: correct_next_hop_absent_after_injection
      description: The route no longer points to R2
    - id: end_to_end_connectivity_fails
      description: HostA can no longer reach HostB
    - id: local_gateway_remains_reachable
      description: HostA can still reach R1
    - id: transit_neighbor_remains_reachable
      description: R1 can still reach R2
    - id: downstream_path_remains_reachable
      description: R2 can still reach HostB through R3

  ground_truth:
    fault_category: routing
    fault_type: wrong_next_hop
    fault_location: r1
    affected_prefix: 10.20.3.0/24
    correct_next_hop: 10.20.12.2
    wrong_next_hop: 10.20.12.6
    root_cause: >
      R1 contains the HostB route, but its configured next-hop is an
      unassigned address on the R1-R2 segment

  restoration:
    method: replace_route
    command:
      - ip
      - route
      - replace
      - 10.20.3.0/24
      - via
      - 10.20.12.2
      - dev
      - eth2
