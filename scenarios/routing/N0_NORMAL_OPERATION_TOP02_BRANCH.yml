schema_version: 1

scenario:
  id: N0_NORMAL_OPERATION_TOP02_BRANCH
  name: Normal TOP-02 branch operation
  kind: normal
  variant_id: canonical
  split_group_id: CTX_G03_TOP02_BRANCH_MID
  category: baseline
  description: >
    Observe the healthy TOP_02_BRANCH path toward HostC while the
    independent R3-HostB branch remains active.

  topology:
    id: TOP_02_BRANCH
    file: labs/topologies/top02_branch/topology.clab.yml

  observation:
    schema_version: 1
    direction: hosta_to_hostc
    source_container: clab-top02branch-hosta
    source_gateway_address: 10.30.1.1
    destination_address: 10.30.4.10
    destination_prefix: 10.30.4.0/24
    route_observer_node: r2
    route_observer_container: clab-top02branch-r2
    expected_next_hop: 10.30.24.2
    transit_node: r4
    transit_container: clab-top02branch-r4

  preconditions:
    - id: baseline_observed_arm_connectivity
      description: HostA reaches HostC through R1, R2, and R4
    - id: baseline_independent_arm_connectivity
      description: HostA reaches HostB through R1, R2, and R3
    - id: expected_route_present
      description: R2 contains the valid route toward HostC
    - id: expected_next_hop_reachable
      description: R2 reaches the configured R4 next-hop
    - id: transit_reaches_destination
      description: R4 reaches HostC

  expected_effects:
    - id: no_fault_injected
      description: No configuration change is performed
    - id: observed_arm_remains_available
      description: HostA continues to reach HostC
    - id: independent_arm_remains_available
      description: HostA continues to reach HostB
    - id: baseline_remains_valid
      description: TOP_02_BRANCH remains valid after collection

  ground_truth:
    fault_category: null
    fault_type: no_fault
    fault_location: null
    affected_prefix: null
    root_cause: null
