schema_version: 1

scenario:
  id: N0_NORMAL_OPERATION_TOP03_ASYMMETRIC_RETURN
  name: Normal TOP-03 asymmetric-return operation
  kind: normal
  variant_id: canonical
  split_group_id: CTX_G05_TOP03_ASYMMETRIC_RETURN
  category: baseline
  description: >
    Observe the healthy HostA-to-HostB forward path through
    R1-R2-R3 while HostB-to-HostA return traffic follows the
    separate R3-R4-R1 corridor.

  topology:
    id: TOP_03_ASYMMETRIC_RETURN
    file: labs/topologies/top03_asymmetric_return/topology.clab.yml

  observation:
    schema_version: 1
    direction: hosta_to_hostb
    source_container: clab-top03asym-hosta
    source_gateway_address: 10.50.1.1
    destination_address: 10.50.3.10
    destination_prefix: 10.50.3.0/24
    route_observer_node: r2
    route_observer_container: clab-top03asym-r2
    expected_next_hop: 10.50.23.2
    transit_node: r3
    transit_container: clab-top03asym-r3

  preconditions:
    - id: forward_path_connectivity
      description: HostA reaches HostB through R1, R2, and R3
    - id: return_path_connectivity
      description: HostB reaches HostA through R3, R4, and R1
    - id: expected_route_present
      description: R2 contains the valid route toward HostB
    - id: expected_next_hop_reachable
      description: R2 reaches the configured R3 next-hop
    - id: transit_reaches_destination
      description: R3 reaches HostB
    - id: return_corridor_configured
      description: R3 returns through R4 and R4 continues through R1
    - id: reverse_path_filtering_disabled
      description: Routed interfaces permit the frozen asymmetry

  expected_effects:
    - id: no_fault_injected
      description: No configuration change is performed
    - id: forward_path_remains_available
      description: HostA continues to reach HostB
    - id: return_path_remains_available
      description: HostB continues to reach HostA
    - id: asymmetric_routes_remain_distinct
      description: R2 remains forward-only and R4 remains return-only
    - id: baseline_remains_valid
      description: TOP_03_ASYMMETRIC_RETURN remains valid

  ground_truth:
    fault_category: null
    fault_type: no_fault
    fault_location: null
    affected_prefix: null
    root_cause: null
