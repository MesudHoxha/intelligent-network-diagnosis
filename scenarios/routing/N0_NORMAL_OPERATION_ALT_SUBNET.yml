schema_version: 1

scenario:
  id: N0_NORMAL_OPERATION
  name: Normal TOP-01 operation on alternate HostB subnet
  kind: normal
  variant_id: alternate_hostb_subnet
  split_group_id: TOP_01:N0_NORMAL_OPERATION:canonical
  category: baseline
  description: >
    Observe the healthy TOP-01 routing state toward the alternate
    HostB network without injecting or restoring a fault.

  topology:
    id: TOP_01
    file: labs/topologies/top01_routed/topology.clab.yml

  observation:
    schema_version: 1
    direction: hosta_to_hostb
    source_container: clab-top01-hosta
    source_gateway_address: 10.10.1.1
    destination_address: 10.10.22.10
    destination_prefix: 10.10.22.0/24
    route_observer_node: r1
    route_observer_container: clab-top01-r1
    expected_next_hop: 10.10.12.2
    transit_node: r2
    transit_container: clab-top01-r2

  preconditions:
    - id: baseline_end_to_end_connectivity
      description: HostA reaches the alternate HostB address
    - id: expected_route_present
      description: R1 contains the valid alternate route
    - id: expected_next_hop_reachable
      description: R1 reaches the configured R2 next-hop

  expected_effects:
    - id: no_fault_injected
      description: No configuration change is performed
    - id: end_to_end_connectivity_remains_available
      description: HostA continues to reach alternate HostB
    - id: baseline_remains_valid
      description: TOP-01 remains valid after evidence collection

  ground_truth:
    fault_category: null
    fault_type: no_fault
    fault_location: null
    affected_prefix: null
    root_cause: null
