schema_version: 1

scenario:
  id: N0_NORMAL_OPERATION_G01_TOP01_LINEAR_2R
  name: Normal G01 TOP-01 linear operation
  kind: normal
  variant_id: canonical
  split_group_id: CTX_G01_TOP01_LINEAR_2R
  category: baseline
  description: >
    Observe the healthy TOP_01 linear two-router context for the
    first complete multi-context dataset campaign. This binding does
    not replace or relabel historical TOP-01 scenarios.

  topology:
    id: TOP_01
    file: labs/topologies/top01_routed/topology.clab.yml

  observation:
    schema_version: 1
    direction: hosta_to_hostb
    source_container: clab-top01-hosta
    source_gateway_address: 10.10.1.1
    destination_address: 10.10.2.10
    destination_prefix: 10.10.2.0/24
    route_observer_node: r1
    route_observer_container: clab-top01-r1
    expected_next_hop: 10.10.12.2
    transit_node: r2
    transit_container: clab-top01-r2

  preconditions:
    - id: baseline_end_to_end_connectivity
      description: HostA reaches HostB before evidence collection
    - id: expected_route_present
      description: R1 contains the valid route toward HostB
    - id: expected_next_hop_reachable
      description: R1 reaches the configured R2 next-hop

  expected_effects:
    - id: no_fault_injected
      description: No configuration change is performed
    - id: end_to_end_connectivity_remains_available
      description: HostA continues to reach HostB
    - id: baseline_remains_valid
      description: TOP-01 remains valid after evidence collection

  ground_truth:
    fault_category: null
    fault_type: no_fault
    fault_location: null
    affected_prefix: null
    root_cause: null
