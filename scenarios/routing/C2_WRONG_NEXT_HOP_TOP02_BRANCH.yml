schema_version: 1

scenario:
  id: C2_WRONG_NEXT_HOP_TOP02_BRANCH
  name: Wrong next-hop on TOP-02 branch R2
  kind: fault
  variant_id: canonical
  split_group_id: CTX_G03_TOP02_BRANCH_MID
  category: routing
  description: >
    Replace the valid R2 HostC route with an unreachable same-segment
    next-hop while R4, HostC, and the R3-HostB arm remain healthy.

  topology:
    id: TOP_02_BRANCH
    file: labs/topologies/top02_branch/topology.clab.yml

  observation:
    schema_version: 1
    direction: hosta_to_hostc
    source_container: clab-top02branch-hosta
    source_gateway_address: 10.30.1.1
    destination_address: 10.30.4.10
    destination_prefix: 10.30.4.0/24
    route_observer_node: r2
    route_observer_container: clab-top02branch-r2
    expected_next_hop: 10.30.24.2
    transit_node: r4
    transit_container: clab-top02branch-r4

  fault:
    type: wrong_next_hop
    injector: replace_route_next_hop
    target_node: r2
    target_container: clab-top02branch-r2
    parameters:
      destination_prefix: 10.30.4.0/24
      correct_next_hop: 10.30.24.2
      wrong_next_hop: 10.30.24.6
      egress_interface: eth3

  preconditions:
    - id: route_exists_before_injection
      description: R2 contains the HostC route
    - id: correct_next_hop_present_before_injection
      description: The route uses the valid R4 next-hop
    - id: baseline_observed_arm_connectivity
      description: HostA reaches HostC before injection
    - id: baseline_independent_arm_connectivity
      description: HostA reaches HostB before injection
    - id: correct_next_hop_reachable
      description: R2 reaches R4 before injection
    - id: wrong_next_hop_unreachable
      description: The unassigned 10.30.24.6 address is unreachable
    - id: transit_reaches_destination
      description: R4 reaches HostC before injection

  expected_effects:
    - id: route_present_after_injection
      description: The HostC route remains installed on R2
    - id: wrong_next_hop_present_after_injection
      description: The route points to unreachable 10.30.24.6
    - id: correct_next_hop_absent_after_injection
      description: The route no longer points to R4
    - id: observed_arm_connectivity_fails
      description: HostA can no longer reach HostC
    - id: local_gateway_remains_reachable
      description: HostA can still reach R1
    - id: transit_neighbor_remains_reachable
      description: R2 can still reach R4
    - id: selected_transit_path_remains_reachable
      description: R4 can still reach HostC
    - id: independent_arm_remains_available
      description: The R3-HostB branch remains healthy

  ground_truth:
    fault_category: routing
    fault_type: wrong_next_hop
    fault_location: r2
    affected_prefix: 10.30.4.0/24
    correct_next_hop: 10.30.24.2
    wrong_next_hop: 10.30.24.6
    root_cause: >
      Interior branch router R2 contains the HostC route, but its
      configured next-hop is unassigned on the R2-R4 segment

  restoration:
    method: replace_route
    command:
      - ip
      - route
      - replace
      - 10.30.4.0/24
      - via
      - 10.30.24.2
      - dev
      - eth3
