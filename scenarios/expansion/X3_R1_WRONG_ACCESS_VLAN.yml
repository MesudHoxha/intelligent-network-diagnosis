schema_version: 1
scenario:
  id: X3_R1_WRONG_ACCESS_VLAN
  name: X3-R1 wrong access VLAN
  kind: fault
  truth_model: single_fault
  variant_id: x3_r1_wrong_access_vlan_v1
  category: controlled_fault
  description: Move only the HostA-facing SW1 access port from VLAN 10 to controlled VLAN 20.
  topology:
    id: X3_TOP_01_L2_VLAN
    file: labs/topologies/x3_r1_l2_vlan/topology.clab.yml
    context_id: x3_top_01_l2_vlan_context_v1
    context_file: labs/topologies/x3_r1_l2_vlan/topology_context_v1.json
  observation:
    direction: hosta_to_hostb
    source_node: hosta
    source_container: clab-x3r1-hosta
    source_interface: eth1
    source_address: 10.30.10.10
    destination_node: hostb
    destination_container: clab-x3r1-hostb
    destination_interface: eth1
    destination_address: 10.30.10.20
    native_source_node: hostc
    native_source_container: clab-x3r1-hostc
    native_destination_node: hostd
    native_destination_address: 10.30.99.20
    target_switch_node: sw1
    target_switch_container: clab-x3r1-sw1
    peer_switch_node: sw2
    peer_switch_container: clab-x3r1-sw2
    bridge: br0
    target_access_interface: eth1
    peer_access_interface: eth1
    trunk_interface: eth3
    expected_vlan: 10
    native_vlan: 99
  fault:
    type: wrong_access_vlan
    injector: replace_expected_access_pvid_with_controlled_wrong_vlan
    target_node: sw1
    target_container: clab-x3r1-sw1
    parameters:
      bridge: br0
      access_interface: eth1
      expected_vlan: 10
      wrong_vlan: 20
  ground_truth:
    fault_category: l2_vlan
    fault_type: wrong_access_vlan
    fault_location: sw1
    affected_resource: eth1
    root_cause: SW1 classifies HostA ingress traffic into VLAN 20 instead of expected VLAN 10.
  restoration:
    method: restore_exact_access_pvid_and_untagged_membership
