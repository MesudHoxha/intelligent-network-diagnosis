    injector: replace_native_pvid_on_one_trunk_endpoint_with_controlled_mismatch
    target_node: sw1
    target_container: clab-x3r1-sw1
    parameters:
      bridge: br0
      trunk_interface: eth3
      expected_vlan: 99
      mismatched_native_vlan: 98
  ground_truth:
    fault_category: l2_vlan
    fault_type: native_vlan_mismatch
    fault_location: sw1
    affected_resource: eth3:native-vlan
    root_cause: SW1 trunk native PVID is VLAN 98 while its peer remains VLAN 99.
  restoration:
    method: restore_exact_peer_native_pvid_and_tagging
